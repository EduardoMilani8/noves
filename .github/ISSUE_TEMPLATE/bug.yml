name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu?
      description: Inclua o comando rodado e a saída. Mascare senhas, CPFs e nomes.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do noves
      description: Saída de `noves version`
    validations:
      required: true
  - type: input
    id: bancos
    attributes:
      label: Versões do Firebird e do PostgreSQL
      description: A saída de `noves doctor` ajuda (sem a senha).
